<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <style>
      .chain-link {
        stroke: #F59E0B;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        fill: none;
      }
      .lbl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .lbl-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10px; }
    </style>

    <linearGradient id="chainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1A02" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
  </defs>

  <rect width="920" height="240" rx="12" fill="url(#chainBg)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(30, 20)">
    <circle cx="6" cy="10" r="4" fill="#FBBF24">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="14" class="lbl-title" fill="#FBBF24" letter-spacing="1.2">
      DECENTRALIZED EVM IMMUTABLE PROOF-OF-EXISTENCE &amp; BLOCKCHAIN ANCHORING
    </text>
    <rect x="680" y="0" width="180" height="20" rx="4" fill="#070D1A" stroke="#78350F" />
    <text x="696" y="14" class="lbl-mono" fill="#FCD34D" font-weight="700">CHAIN ID: 31337 / SEPOLIA</text>
  </g>

  <!-- Block 41 -->
  <g transform="translate(30, 55)">
    <rect width="240" height="150" rx="8" fill="url(#blockGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect width="240" height="28" rx="8" fill="#0F172A" />
    <text x="12" y="19" class="lbl-title" fill="#F8FAFC">Block #41 (Confirmed)</text>
    <text x="180" y="19" class="lbl-mono" fill="#00FF88">&#10003; MINED</text>

    <text x="12" y="48" class="lbl-mono" fill="#64748B">PrevHash: 0x4a12...89b1</text>
    <text x="12" y="64" class="lbl-mono" fill="#64748B">StateRoot: 0x98cf...041e</text>

    <rect x="10" y="74" width="220" height="66" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="16" y="92" class="lbl-mono" fill="#00F2FE">Tx: registerEvidence()</text>
    <text x="16" y="106" class="lbl-mono" fill="#94A3B8">ID: EVD-2026-001</text>
    <text x="16" y="122" class="lbl-mono" fill="#FCD34D" font-size="8.5">Commit: 0x8f3c...LEXCHAIN:EV1</text>
    <text x="16" y="134" class="lbl-mono" fill="#00FF88" font-size="8.5">Gas: 92,450 &#8226; Status: SUCCESS</text>
  </g>

  <!-- Chaining Link 1 -->
  <path d="M 270 130 L 340 130" stroke="#1E293B" stroke-width="3" fill="none" />
  <path d="M 270 130 L 340 130" class="chain-link">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle cx="270" cy="130" r="3.5" fill="#F59E0B">
    <animate attributeName="cx" values="270; 340" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Block 42 (Active/Target Block) -->
  <g transform="translate(340, 55)">
    <rect width="240" height="150" rx="8" fill="url(#activeGrad)" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect width="240" height="28" rx="8" fill="#3D1A02" />
    <circle cx="16" cy="14" r="4" fill="#F59E0B">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="19" class="lbl-title" fill="#FFFFFF">Block #42 (Authoritative)</text>
    <text x="180" y="19" class="lbl-mono" fill="#FCD34D">&#8226; ACTIVE</text>

    <text x="12" y="48" class="lbl-mono" fill="#94A3B8">PrevHash: 0xb57c...90e2</text>
    <text x="12" y="64" class="lbl-mono" fill="#94A3B8">EvidenceRegistry.sol</text>

    <rect x="10" y="74" width="220" height="66" rx="4" fill="#02040A" stroke="#78350F" />
    <text x="16" y="92" class="lbl-mono" fill="#00F2FE">Tx: anchorCustodyEvent()</text>
    <text x="16" y="106" class="lbl-mono" fill="#94A3B8">Type: CUSTODY_TRANSFERRED</text>
    <text x="16" y="122" class="lbl-mono" fill="#FCD34D" font-size="8.5">Keccak: 0x12a8...f9c0</text>
    <text x="16" y="134" class="lbl-mono" fill="#00FF88" font-size="8.5">Gas: 48,210 &#8226; Status: CONFIRMED</text>
  </g>

  <!-- Chaining Link 2 -->
  <path d="M 580 130 L 650 130" stroke="#1E293B" stroke-width="3" fill="none" />
  <path d="M 580 130 L 650 130" class="chain-link">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle cx="580" cy="130" r="3.5" fill="#00F2FE">
    <animate attributeName="cx" values="580; 650" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Block 43 (Pending / Queue Sync) -->
  <g transform="translate(650, 55)">
    <rect width="240" height="150" rx="8" fill="url(#blockGrad)" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5" />
    <rect width="240" height="28" rx="8" fill="#0B1E38" />
    <text x="12" y="19" class="lbl-title" fill="#00F2FE">Block #43 (Offline Queue)</text>
    <text x="180" y="19" class="lbl-mono" fill="#60A5FA">&#8226; SYNCING</text>

    <text x="12" y="48" class="lbl-mono" fill="#64748B">Batch Buffer: 1 Pending Op</text>
    <text x="12" y="64" class="lbl-mono" fill="#64748B">Automatic Reconnect Drain</text>

    <rect x="10" y="74" width="220" height="66" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="16" y="92" class="lbl-mono" fill="#60A5FA">Queued: registerEvidence()</text>
    <text x="16" y="106" class="lbl-mono" fill="#64748B">Source: SQLite blockchain_queue</text>
    <text x="16" y="122" class="lbl-mono" fill="#FCD34D" font-size="8.5">Nonce Auto-Managed</text>
    <text x="16" y="134" class="lbl-mono" fill="#00F2FE" font-size="8.5">State: Ready for Mining</text>
  </g>
</svg>
