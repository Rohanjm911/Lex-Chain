<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      @keyframes queueFlow {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes signalPulse {
        0%, 100% { fill: #EF4444; filter: drop-shadow(0 0 2px #EF4444); }
        50% { fill: #10B981; filter: drop-shadow(0 0 8px #10B981); }
      }
      @keyframes syncSweep {
        0% { transform: scaleX(0); opacity: 0.2; }
        50% { transform: scaleX(1); opacity: 0.9; }
        100% { transform: scaleX(0); opacity: 0.2; }
      }
      @keyframes packetMove {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(180px); opacity: 0; }
      }
      .q-wire {
        stroke: #F59E0B;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        animation: queueFlow 2s linear infinite;
        fill: none;
      }
      .sync-wire {
        stroke: #10B981;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        animation: queueFlow 1.5s linear infinite;
        fill: none;
      }
      .panel-box { rx: 8; ry: 8; stroke-width: 1.5; }
      .lbl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .lbl-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 9.5px; }
      .lbl-code { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10px; font-weight: 600; }
    </style>

    <linearGradient id="bgSync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="920" height="280" rx="12" fill="url(#bgSync)" stroke="#1E293B" stroke-width="2" />

  <!-- Header Banner -->
  <g transform="translate(30, 20)">
    <text x="0" y="14" class="lbl-title" fill="#38BDF8" letter-spacing="1.2">
      OFFLINE-FIRST RESILIENCE &amp; AUTOMATIC QUEUE REPLAY ENGINE
    </text>
    <rect x="630" y="0" width="230" height="20" rx="4" fill="#065F46" stroke="#059669" />
    <text x="640" y="14" class="lbl-mono" fill="#6EE7B7" font-weight="700">&check; ZERO WORKSTATION BLOCKING</text>
  </g>

  <!-- Section 1: Air-Gapped Workstation -->
  <g transform="translate(30, 55)">
    <rect width="240" height="155" class="panel-box" fill="#1E293B" stroke="#334155" />
    <rect width="240" height="28" rx="8" fill="#334155" />
    <text x="12" y="18" class="lbl-title" fill="#F8FAFC">Air-Gapped Field Laptop</text>
    <rect x="170" y="5" width="60" height="18" rx="3" fill="#64748B" />
    <text x="177" y="17" class="lbl-mono" fill="#FFFFFF">OFFLINE</text>

    <text x="12" y="46" class="lbl-mono" fill="#94A3B8">Scenario: Field Crime Scene</text>
    <text x="12" y="60" class="lbl-mono" fill="#38BDF8">&bull; Zero Internet / Faraday Enclosure</text>
    
    <rect x="10" y="70" width="220" height="72" rx="4" fill="#0B132B" stroke="#1E293B" />
    <text x="16" y="87" class="lbl-mono" fill="#10B981">&check; 64KB Streaming Hash: OK</text>
    <text x="16" y="103" class="lbl-mono" fill="#10B981">&check; Vault Copy &amp; Win32 ACL: OK</text>
    <text x="16" y="119" class="lbl-mono" fill="#10B981">&check; SQLite Intake Row Inserted</text>
    <text x="16" y="134" class="lbl-mono" fill="#F59E0B">&bull; EVM Broadcast: Buffering in DB</text>
  </g>

  <!-- Connective Pipe 1: To SQLite Queue -->
  <path d="M 270 132 L 340 132" class="q-wire" />

  <!-- Section 2: SQLite Persistent Queue -->
  <g transform="translate(340, 55)">
    <rect width="240" height="155" class="panel-box" fill="url(#queueGrad)" stroke="#F59E0B" stroke-width="1.5" />
    <rect width="240" height="28" rx="8" fill="#78350F" />
    <text x="12" y="18" class="lbl-title" fill="#FDE68A">SQLite Persistent Buffer</text>
    <rect x="170" y="5" width="60" height="18" rx="3" fill="#B45309" />
    <text x="176" y="17" class="lbl-mono" fill="#FFFFFF">PENDING</text>

    <text x="12" y="46" class="lbl-mono" fill="#FCD34D">Table: `blockchain_queue`</text>
    
    <g transform="translate(10, 54)">
      <rect width="220" height="24" rx="3" fill="#0B132B" stroke="#78350F" />
      <text x="8" y="16" class="lbl-mono" fill="#FDE68A">QUE-001 | EVD-2026-001 | Pending</text>
    </g>
    <g transform="translate(10, 82)">
      <rect width="220" height="24" rx="3" fill="#0B132B" stroke="#78350F" />
      <text x="8" y="16" class="lbl-mono" fill="#FDE68A">QUE-002 | EVD-2026-002 | Pending</text>
    </g>

    <rect x="10" y="112" width="220" height="30" rx="3" fill="#0B132B" stroke="#1E293B" />
    <circle cx="20" cy="127" r="4" style="animation: signalPulse 2s infinite;" />
    <text x="32" y="131" class="lbl-mono" fill="#94A3B8">Heartbeat Ping: <tspan fill="#38BDF8">RPC :8545 (15s)</tspan></text>
  </g>

  <!-- Connective Pipe 2: To Blockchain Node -->
  <path d="M 580 132 L 650 132" class="sync-wire" />

  <!-- Section 3: EVM Node Reconnected & Confirmed -->
  <g transform="translate(650, 55)">
    <rect width="240" height="155" class="panel-box" fill="url(#chainGrad)" stroke="#10B981" stroke-width="1.5" />
    <rect width="240" height="28" rx="8" fill="#064E3B" />
    <text x="12" y="18" class="lbl-title" fill="#A7F3D0">EVM Decentralized Ledger</text>
    <rect x="165" y="5" width="65" height="18" rx="3" fill="#047857" />
    <text x="171" y="17" class="lbl-mono" fill="#FFFFFF">SYNCED</text>

    <text x="12" y="46" class="lbl-mono" fill="#6EE7B7">Automatic Batch Replay</text>
    
    <rect x="10" y="56" width="220" height="86" rx="4" fill="#0B132B" stroke="#065F46" />
    <text x="16" y="74" class="lbl-mono" fill="#6EE7B7">&bull; Batch Processed: 2/2 Tx Mined</text>
    <text x="16" y="90" class="lbl-code" fill="#38BDF8">Tx: 0x9b4ae8c...1c2e</text>
    <text x="16" y="106" class="lbl-mono" fill="#94A3B8">Block: <tspan fill="#A7F3D0">#43 (1.2s confirmation)</tspan></text>
    <text x="16" y="124" class="lbl-mono" fill="#10B981">&check; Status: Registered On-Chain</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(30, 226)">
    <rect width="860" height="36" rx="6" fill="#1E293B" stroke="#334155" />
    <circle cx="20" cy="18" r="5" fill="#38BDF8" />
    <text x="35" y="22" class="lbl-title" fill="#F8FAFC">
      FAULT-TOLERANT ARCHITECTURE: 
      <tspan fill="#38BDF8">Local intake never fails if network drops</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#F59E0B">Transactional SQLite Buffering</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#10B981">Zero Human Intervention Needed for Re-Sync</tspan>
    </text>
  </g>
</svg>
