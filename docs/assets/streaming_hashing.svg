<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <style>
      @keyframes chunkSlide {
        0% { transform: translateX(0px); opacity: 0.1; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(330px); opacity: 0.1; }
      }
      @keyframes hashPulse {
        0%, 100% { fill: #2563EB; filter: drop-shadow(0 0 2px #2563EB); }
        50% { fill: #38BDF8; filter: drop-shadow(0 0 10px #38BDF8); }
      }
      @keyframes bitStream {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      .chunk-box {
        animation: chunkSlide 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .bit-wire {
        stroke: #38BDF8;
        stroke-width: 2.5;
        stroke-dasharray: 6 10;
        animation: bitStream 1.8s linear infinite;
        fill: none;
      }
      .card-box { rx: 8; ry: 8; stroke-width: 1.5; }
      .lbl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .lbl-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10px; }
    </style>

    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="920" height="260" rx="12" fill="url(#streamBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Header Banner -->
  <g transform="translate(30, 20)">
    <text x="0" y="14" class="lbl-title" fill="#38BDF8" letter-spacing="1.2">
      RUST NATIVE 64KB CHUNKED STREAMING HASH &amp; DOMAIN COMMITMENT ENGINE
    </text>
    <rect x="680" y="0" width="180" height="20" rx="4" fill="#1E293B" stroke="#334155" />
    <text x="692" y="14" class="lbl-mono" fill="#10B981" font-weight="700">MEMORY PROFILE: O(1) CONSTANT</text>
  </g>

  <!-- Left: Source Disk File Stream -->
  <g transform="translate(30, 55)">
    <rect width="210" height="150" class="card-box" fill="#1E293B" stroke="#334155" />
    <rect width="210" height="26" rx="8" fill="#334155" />
    <text x="12" y="18" class="lbl-title" fill="#F8FAFC">Forensic Source File</text>
    <text x="12" y="48" class="lbl-mono" fill="#94A3B8">Disk Image / Packet Dump</text>
    <text x="12" y="66" class="lbl-mono" fill="#38BDF8">Arbitrary Size: 1MB &ndash; 1TB+</text>

    <rect x="12" y="80" width="186" height="56" rx="4" fill="#0B132B" stroke="#1E293B" />
    <text x="18" y="98" class="lbl-mono" fill="#64748B">Pre-Read Assertions:</text>
    <text x="18" y="114" class="lbl-mono" fill="#10B981">&check; S_initial == FileSize</text>
    <text x="18" y="128" class="lbl-mono" fill="#10B981">&check; T_initial == Modified</text>
  </g>

  <!-- Pipeline Connection 1 -->
  <path d="M 240 130 L 320 130" stroke="#334155" stroke-width="3" fill="none" />
  <path d="M 240 130 L 320 130" class="bit-wire" />

  <!-- Center: 64KB Buffer Pipeline -->
  <g transform="translate(320, 55)">
    <rect width="260" height="150" class="card-box" fill="#0F172A" stroke="#2563EB" />
    <rect width="260" height="26" rx="8" fill="#1D4ED8" />
    <text x="14" y="18" class="lbl-title" fill="#FFFFFF">64KB Streaming Window (Chunked)</text>

    <!-- Moving Buffer Animation -->
    <rect x="20" y="44" width="70" height="28" rx="4" fill="#2563EB" class="chunk-box">
      <text x="12" y="18" class="lbl-mono" fill="#FFFFFF" font-weight="700">64KB Chunk</text>
    </rect>

    <rect x="14" y="84" width="232" height="52" rx="4" fill="#1E293B" stroke="#334155" />
    <text x="20" y="102" class="lbl-mono" fill="#93C5FD">Digest::update(&amp;chunk)</text>
    <text x="20" y="118" class="lbl-mono" fill="#60A5FA">Zero Heap Allocation</text>
    <text x="20" y="130" class="lbl-mono" fill="#10B981">&check; Active Tamper Abort Guard</text>
  </g>

  <!-- Pipeline Connection 2 -->
  <path d="M 580 130 L 660 130" stroke="#334155" stroke-width="3" fill="none" />
  <path d="M 580 130 L 660 130" class="bit-wire" />

  <!-- Right: Cryptographic Outputs -->
  <g transform="translate(660, 55)">
    <rect width="230" height="150" class="card-box" fill="#1E293B" stroke="#059669" />
    <rect width="230" height="26" rx="8" fill="#065F46" />
    <text x="14" y="18" class="lbl-title" fill="#FFFFFF">Authoritative Output</text>

    <text x="14" y="46" class="lbl-mono" fill="#94A3B8">1. Raw Bitstream SHA-256:</text>
    <rect x="14" y="52" width="202" height="22" rx="3" fill="#0B132B" stroke="#047857" />
    <text x="18" y="67" class="lbl-mono" fill="#34D399" font-size="9">d7a8fbb307d78094...c9e592</text>

    <text x="14" y="92" class="lbl-mono" fill="#94A3B8">2. Domain-Separated Commitment:</text>
    <rect x="14" y="98" width="202" height="34" rx="3" fill="#0B132B" stroke="#D97706" />
    <text x="18" y="112" class="lbl-mono" fill="#FCD34D" font-size="8.5">LEXCHAIN:EV1:CASE:FILE:SIZE:HASH</text>
    <text x="18" y="125" class="lbl-mono" fill="#FDE68A" font-size="8.5">&rarr; 32-Byte Immutable Anchor</text>
  </g>

  <!-- Bottom Concurrency Guard Bar -->
  <g transform="translate(30, 220)">
    <rect width="860" height="24" rx="4" fill="#0B132B" stroke="#334155" />
    <circle cx="16" cy="12" r="4" fill="#10B981" />
    <text x="30" y="16" class="lbl-mono" fill="#94A3B8">
      Post-Read Concurrency Assertion: S_initial == S_final &amp;&amp; T_initial == T_final &bull; 0 Byte Drift &bull; Stream Integrity Validated
    </text>
  </g>
</svg>
