<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      .beam-line {
        stroke: #00F2FE;
        stroke-width: 2;
        stroke-dasharray: 6 8;
        fill: none;
      }
      .beam-gold {
        stroke: #F59E0B;
        stroke-width: 2.5;
        stroke-dasharray: 8 10;
        fill: none;
      }
      .box-card { rx: 8; ry: 8; stroke-width: 1.5; }
      .lbl-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .lbl-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 9.5px; }
      .lbl-code { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10.5px; font-weight: 600; }
    </style>

    <linearGradient id="bgCommit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="outGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1A02" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
  </defs>

  <rect width="920" height="280" rx="12" fill="url(#bgCommit)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" />

  <!-- Header Banner -->
  <g transform="translate(30, 20)">
    <circle cx="6" cy="10" r="4" fill="#00F2FE">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="14" class="lbl-title" fill="#00F2FE" letter-spacing="1.2">
      DOMAIN-SEPARATED CRYPTOGRAPHIC COMMITMENT ARCHITECTURE (LEXCHAIN:EV1)
    </text>
    <rect x="640" y="0" width="220" height="20" rx="4" fill="#070D1A" stroke="#00F2FE" stroke-opacity="0.3" />
    <text x="652" y="14" class="lbl-mono" fill="#00F2FE" font-weight="700">COLLISION IMMUNITY: 2^256</text>
  </g>

  <!-- Left Side: 4 Domain Components -->
  <g transform="translate(30, 52)">
    <!-- Item 1: Domain Salt -->
    <g transform="translate(0, 0)">
      <rect width="250" height="38" class="box-card" fill="#070D1A" stroke="#00F2FE" stroke-opacity="0.4" />
      <text x="12" y="16" class="lbl-mono" fill="#00F2FE">1. Domain Protocol Salt</text>
      <text x="12" y="30" class="lbl-code" fill="#F8FAFC">"LEXCHAIN:EV1:"</text>
      <rect x="180" y="8" width="60" height="18" rx="3" fill="#0B1E38" stroke="#00F2FE" stroke-opacity="0.3" />
      <text x="186" y="21" class="lbl-mono" fill="#00F2FE">PREFIX</text>
    </g>

    <!-- Item 2: Case ID -->
    <g transform="translate(0, 46)">
      <rect width="250" height="38" class="box-card" fill="#070D1A" stroke="#1E293B" />
      <text x="12" y="16" class="lbl-mono" fill="#94A3B8">2. Investigation Namespace</text>
      <text x="12" y="30" class="lbl-code" fill="#F8FAFC">case_id: "CASE-2026-001"</text>
      <rect x="180" y="8" width="60" height="18" rx="3" fill="#0F172A" />
      <text x="188" y="21" class="lbl-mono" fill="#CBD5E1">SCOPE</text>
    </g>

    <!-- Item 3: File Descriptor -->
    <g transform="translate(0, 92)">
      <rect width="250" height="38" class="box-card" fill="#070D1A" stroke="#1E293B" />
      <text x="12" y="16" class="lbl-mono" fill="#94A3B8">3. Envelope Metadata</text>
      <text x="12" y="30" class="lbl-code" fill="#F8FAFC">"dump.raw:10485760"</text>
      <rect x="180" y="8" width="60" height="18" rx="3" fill="#0F172A" />
      <text x="188" y="21" class="lbl-mono" fill="#CBD5E1">SPECS</text>
    </g>

    <!-- Item 4: Raw Bitstream SHA-256 -->
    <g transform="translate(0, 138)">
      <rect width="250" height="38" class="box-card" fill="#070D1A" stroke="#00FF88" stroke-opacity="0.4" />
      <text x="12" y="16" class="lbl-mono" fill="#00FF88">4. Vault Bitstream Digest</text>
      <text x="12" y="30" class="lbl-code" fill="#6EE7B7">"d7a8fbb307...e4f8"</text>
      <rect x="180" y="8" width="60" height="18" rx="3" fill="#042616" stroke="#00FF88" stroke-opacity="0.3" />
      <text x="187" y="21" class="lbl-mono" fill="#00FF88">SHA256</text>
    </g>
  </g>

  <!-- Animated Convergence Beams -->
  <path d="M 280 71 C 330 71, 340 141, 380 141" class="beam-line">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <path d="M 280 117 C 330 117, 340 141, 380 141" class="beam-line">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <path d="M 280 163 C 330 163, 340 141, 380 141" class="beam-line">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <path d="M 280 209 C 330 209, 340 141, 380 141" class="beam-line">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>

  <!-- Moving Traveling Laser Photons along curves -->
  <circle r="3" fill="#00F2FE">
    <animateMotion path="M 280 71 C 330 71, 340 141, 380 141" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#00F2FE">
    <animateMotion path="M 280 117 C 330 117, 340 141, 380 141" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#00F2FE">
    <animateMotion path="M 280 163 C 330 163, 340 141, 380 141" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#00FF88">
    <animateMotion path="M 280 209 C 330 209, 340 141, 380 141" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Center: Native Rust Cryptographic Hasher -->
  <g transform="translate(380, 65)">
    <rect width="200" height="152" class="box-card" fill="url(#engineGrad)" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="2" />
    <rect width="200" height="28" rx="8" fill="#0B1E38" />
    <text x="16" y="18" class="lbl-title" fill="#FFFFFF">Rust Hasher Engine</text>
    <circle cx="180" cy="14" r="5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="4; 6; 4" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <text x="14" y="48" class="lbl-mono" fill="#00F2FE">Memory Stream Buffer:</text>
    <rect x="12" y="54" width="176" height="26" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="18" y="71" class="lbl-mono" fill="#F8FAFC">abi.encodePacked(...) &#8801;</text>

    <text x="14" y="98" class="lbl-mono" fill="#00F2FE">Cryptographic Hash:</text>
    <rect x="12" y="104" width="176" height="34" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="18" y="122" class="lbl-mono" fill="#00FF88" font-weight="700">sha256(raw_bytes)</text>
    <text x="18" y="133" class="lbl-mono" fill="#64748B">Standard Rust `sha2::Sha256`</text>
  </g>

  <!-- Beam to EVM Output -->
  <path d="M 580 141 L 640 141" class="beam-gold">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>
  <circle cx="580" cy="141" r="3.5" fill="#F59E0B">
    <animate attributeName="cx" values="580; 640" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- Right Side: Final On-Chain Anchor Output -->
  <g transform="translate(640, 65)">
    <rect width="250" height="152" class="box-card" fill="url(#outGrad)" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4; 0.9; 0.4" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect width="250" height="28" rx="8" fill="#3D1A02" />
    <text x="16" y="18" class="lbl-title" fill="#FDE68A">On-Chain Commitment</text>
    <rect x="175" y="5" width="65" height="18" rx="3" fill="#B45309" />
    <text x="181" y="18" class="lbl-mono" fill="#FFFFFF">EVM BYTES32</text>

    <text x="14" y="48" class="lbl-mono" fill="#FCD34D">Domain Commitment Digest:</text>
    <rect x="12" y="54" width="226" height="30" rx="4" fill="#02040A" stroke="#78350F" />
    <text x="18" y="73" class="lbl-code" fill="#FDE68A">0x9b4ae8c142b93e82...5e1a</text>

    <text x="14" y="102" class="lbl-mono" fill="#FCD34D">Smart Contract Assertion:</text>
    <rect x="12" y="108" width="226" height="30" rx="4" fill="#042616" stroke="#00FF88" stroke-opacity="0.4" />
    <text x="18" y="127" class="lbl-mono" fill="#00FF88" font-weight="700">&#10003; MATCHES EvidenceRegistry.sol</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(30, 238)">
    <rect width="860" height="28" rx="5" fill="#070D1A" stroke="#1E293B" />
    <text x="16" y="18" class="lbl-mono" fill="#94A3B8">
      CROSS-PROTOCOL SECURITY: 
      <tspan fill="#00FF88">Prevents cross-case spoofing</tspan>
      <tspan fill="#64748B"> &#8226; </tspan>
      <tspan fill="#00F2FE">Replay attack immune</tspan>
      <tspan fill="#64748B"> &#8226; </tspan>
      <tspan fill="#F59E0B">Strictly adheres to NIST SP 800-86 standard</tspan>
    </text>
  </g>
</svg>
