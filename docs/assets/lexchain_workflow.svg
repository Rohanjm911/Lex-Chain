<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      .pipeline-track { stroke: #1E293B; stroke-width: 3; fill: none; stroke-linecap: round; }
      .pipeline-active {
        stroke: #00F2FE;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
      }
      .pipeline-gold {
        stroke: #F59E0B;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
      }
      .pipeline-green {
        stroke: #00FF88;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
      }
      .node-card { rx: 10; ry: 10; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .mono-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10px; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="320" rx="14" fill="url(#bgGrad)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" />

  <!-- Top Title Ribbon -->
  <g transform="translate(30, 24)">
    <circle cx="10" cy="10" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00F2FE" letter-spacing="1.5">
      LEXCHAIN REAL-TIME CRYPTOGRAPHIC EVIDENCE INTEGRITY PIPELINE
    </text>
    <text x="730" y="14" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">
      ISO/IEC 27037 &#8226; FRE 901
    </text>
  </g>

  <!-- Inter-Stage Pipeline Connectors (Background Track) -->
  <path d="M 210 160 L 260 160" class="pipeline-track" />
  <path d="M 430 160 L 480 160" class="pipeline-track" />
  <path d="M 650 160 L 700 160" class="pipeline-track" />

  <!-- Animated Data Pulse Tracks (SMIL stroke-dashoffset) -->
  <path d="M 210 160 L 260 160" class="pipeline-active">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite" />
  </path>
  <path d="M 430 160 L 480 160" class="pipeline-green">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite" />
  </path>
  <path d="M 650 160 L 700 160" class="pipeline-gold">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite" />
  </path>

  <!-- Moving Laser Photons Between Stages -->
  <circle cx="210" cy="160" r="4" fill="#00F2FE">
    <animate attributeName="cx" values="210; 260" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="430" cy="160" r="4" fill="#00FF88">
    <animate attributeName="cx" values="430; 480" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="160" r="4" fill="#F59E0B">
    <animate attributeName="cx" values="650; 700" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- STAGE 1: File Acquisition & Hardware Intake -->
  <g transform="translate(40, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#1E293B" />
    <rect width="170" height="30" rx="10" fill="#0F172A" />
    <text x="14" y="20" class="title-text">1. Digital Intake</text>
    <circle cx="152" cy="15" r="3.5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <text x="14" y="55" class="sub-text">Physical Source / Image</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#02040A" stroke="#1E293B" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#94A3B8">RAM / Disk Bitstream</text>
    <text x="22" y="96" class="mono-text" fill="#00F2FE">Hardware Blocker</text>

    <text x="14" y="126" class="sub-text">Acquisition Pre-Check:</text>
    <text x="14" y="142" class="mono-text" fill="#00FF88">&#10003; Size &amp; Timestamp Snap</text>
    <text x="14" y="158" class="mono-text" fill="#00FF88">&#10003; File Traversal Sanitize</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#070D1A" stroke="#1E293B" />
    <text x="20" y="184" class="mono-text" fill="#64748B" font-size="9">STATUS: ACQUIRED</text>
  </g>

  <!-- STAGE 2: Native Rust Streaming Engine -->
  <g transform="translate(260, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#00F2FE" stroke-opacity="0.4" />
    <rect width="170" height="30" rx="10" fill="#0B1E38" />
    <text x="14" y="20" class="title-text">2. Native Rust Engine</text>
    <circle cx="152" cy="15" r="3.5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <text x="14" y="55" class="sub-text">64KB Streaming Buffer</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#02040A" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#00F2FE">Chunked SHA-256</text>
    <text x="22" y="96" class="mono-text" fill="#93C5FD">Memory-Mapped O(1)</text>

    <text x="14" y="126" class="sub-text">Domain Commitment:</text>
    <text x="14" y="142" class="mono-text" fill="#FCD34D" font-size="9">LEXCHAIN:EV1:Prefix</text>
    <text x="14" y="158" class="mono-text" fill="#00FF88">&#10003; Zero Heap Spillage</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#0B1E38" />
    <text x="20" y="184" class="mono-text" fill="#00F2FE" font-size="9">SHA-256 AUTHORITATIVE</text>
  </g>

  <!-- STAGE 3: Local Forensic Vault & SQLite -->
  <g transform="translate(480, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#00FF88" stroke-opacity="0.4" />
    <rect width="170" height="30" rx="10" fill="#042616" />
    <text x="14" y="20" class="title-text">3. Isolated Vault</text>
    <circle cx="152" cy="15" r="3.5" fill="#00FF88">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <text x="14" y="55" class="sub-text">%USERPROFILE%/Documents</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#02040A" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#00FF88">Bit-Level Parity Test</text>
    <text x="22" y="96" class="mono-text" fill="#6EE7B7">Win32 Read-Only ACL</text>

    <text x="14" y="126" class="sub-text">SQLite Relational State:</text>
    <text x="14" y="142" class="mono-text" fill="#94A3B8">Intake Row Committed</text>
    <text x="14" y="158" class="mono-text" fill="#00FF88">&#10003; Custody Event 0x01 Logged</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#042616" />
    <text x="20" y="184" class="mono-text" fill="#00FF88" font-size="9">TAMPER-SEALED LOCAL</text>
  </g>

  <!-- STAGE 4: Decentralized Blockchain Anchor -->
  <g transform="translate(700, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#F59E0B" stroke-opacity="0.4" />
    <rect width="170" height="30" rx="10" fill="#3D1A02" />
    <text x="14" y="20" class="title-text">4. EVM Blockchain</text>
    <circle cx="152" cy="15" r="3.5" fill="#F59E0B">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <text x="14" y="55" class="sub-text">EvidenceRegistry.sol</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#02040A" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#F59E0B">Block Timestamp</text>
    <text x="22" y="96" class="mono-text" fill="#FCD34D">Tx Hash &amp; Block #</text>

    <text x="14" y="126" class="sub-text">Decentralized Guarantees:</text>
    <text x="14" y="142" class="mono-text" fill="#00FF88">&#10003; Duplicate Prevention</text>
    <text x="14" y="158" class="mono-text" fill="#00FF88">&#10003; Non-Repudiation FRE 901</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#3D1A02" />
    <text x="20" y="184" class="mono-text" fill="#FDE68A" font-size="9">PROOF-OF-EXISTENCE</text>
  </g>

  <!-- Bottom Verification Bar -->
  <g transform="translate(40, 275)">
    <rect width="830" height="26" rx="6" fill="#070D1A" stroke="#1E293B" />
    <circle cx="16" cy="13" r="4" fill="#00FF88" />
    <text x="28" y="17" class="mono-text" fill="#94A3B8">
      GUARANTEE: 
      <tspan fill="#00FF88">Bitstream Zero Alteration Verified</tspan>
      <tspan fill="#64748B"> &#8226; </tspan>
      <tspan fill="#00F2FE">Cryptographic Parity 100%</tspan>
      <tspan fill="#64748B"> &#8226; </tspan>
      <tspan fill="#F59E0B">EVM Block Depth Consensus Anchored</tspan>
    </text>
  </g>
</svg>
