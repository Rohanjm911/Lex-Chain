<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowPacket {
        0% { stroke-dashoffset: 120; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      @keyframes hashScan {
        0% { transform: translateY(0px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateY(70px); opacity: 0; }
      }
      @keyframes nodeBeacon {
        0%, 100% { fill: #10B981; filter: drop-shadow(0 0 2px #10B981); }
        50% { fill: #34D399; filter: drop-shadow(0 0 8px #10B981); }
      }
      .pipeline-track { stroke: #334155; stroke-width: 3; fill: none; stroke-linecap: round; }
      .pipeline-active {
        stroke: #38BDF8;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
        animation: flowPacket 2.4s linear infinite;
      }
      .pipeline-gold {
        stroke: #F59E0B;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
        animation: flowPacket 2.4s linear infinite;
      }
      .pipeline-green {
        stroke: #10B981;
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 8 16;
        animation: flowPacket 2.4s linear infinite;
      }
      .node-card { rx: 10; ry: 10; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .mono-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 10px; }
      .beacon { animation: nodeBeacon 2s ease-in-out infinite; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="320" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Top Title Ribbon -->
  <g transform="translate(30, 24)">
    <circle cx="10" cy="10" r="4" class="beacon" />
    <text x="24" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      LEXCHAIN REAL-TIME CRYPTOGRAPHIC EVIDENCE INTEGRITY PIPELINE
    </text>
    <text x="730" y="14" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">
      ISO/IEC 27037 &bull; FRE 901
    </text>
  </g>

  <!-- Inter-Stage Pipeline Connectors (Background Track) -->
  <path d="M 210 160 L 260 160" class="pipeline-track" />
  <path d="M 430 160 L 480 160" class="pipeline-track" />
  <path d="M 650 160 L 700 160" class="pipeline-track" />

  <!-- Animated Data Pulses -->
  <path d="M 210 160 L 260 160" class="pipeline-active" />
  <path d="M 430 160 L 480 160" class="pipeline-green" />
  <path d="M 650 160 L 700 160" class="pipeline-gold" />

  <!-- STAGE 1: File Acquisition & Hardware Intake -->
  <g transform="translate(40, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#334155" />
    <rect width="170" height="30" rx="10" fill="#1E293B" />
    <text x="14" y="20" class="title-text">1. Digital Intake</text>
    <circle cx="152" cy="15" r="3.5" fill="#38BDF8" />

    <text x="14" y="55" class="sub-text">Physical Source / Image</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#0B132B" stroke="#334155" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#94A3B8">RAM / Disk Bitstream</text>
    <text x="22" y="96" class="mono-text" fill="#38BDF8">Hardware Blocker</text>

    <text x="14" y="126" class="sub-text">Acquisition Pre-Check:</text>
    <text x="14" y="142" class="mono-text" fill="#10B981">&check; Size &amp; Timestamp Snap</text>
    <text x="14" y="158" class="mono-text" fill="#10B981">&check; File Traversal Sanitize</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#1E293B" />
    <text x="20" y="184" class="mono-text" fill="#64748B" font-size="9">STATUS: ACQUIRED</text>
  </g>

  <!-- STAGE 2: Native Rust Streaming Engine -->
  <g transform="translate(260, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#2563EB" />
    <rect width="170" height="30" rx="10" fill="#2563EB" />
    <text x="14" y="20" class="title-text">2. Native Rust Engine</text>
    <circle cx="152" cy="15" r="3.5" fill="#F8FAFC" />

    <text x="14" y="55" class="sub-text">64KB Streaming Buffer</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#0B132B" stroke="#1D4ED8" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#60A5FA">Chunked SHA-256</text>
    <text x="22" y="96" class="mono-text" fill="#93C5FD">Memory-Mapped O(1)</text>

    <text x="14" y="126" class="sub-text">Domain Commitment:</text>
    <text x="14" y="142" class="mono-text" fill="#FCD34D" font-size="9">LEXCHAIN:EV1:Prefix</text>
    <text x="14" y="158" class="mono-text" fill="#10B981">&check; Zero Heap Spillage</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#1E3A8A" />
    <text x="20" y="184" class="mono-text" fill="#93C5FD" font-size="9">SHA-256 AUTHORITATIVE</text>
  </g>

  <!-- STAGE 3: Local Forensic Vault & SQLite -->
  <g transform="translate(480, 65)">
    <rect width="170" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#10B981" />
    <rect width="170" height="30" rx="10" fill="#065F46" />
    <text x="14" y="20" class="title-text">3. Isolated Vault</text>
    <circle cx="152" cy="15" r="3.5" class="beacon" />

    <text x="14" y="55" class="sub-text">%USERPROFILE%/Documents</text>
    <rect x="14" y="65" width="142" height="42" rx="5" fill="#0B132B" stroke="#047857" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#34D399">Bit-Level Parity Test</text>
    <text x="22" y="96" class="mono-text" fill="#6EE7B7">Win32 Read-Only ACL</text>

    <text x="14" y="126" class="sub-text">Custody &amp; Audit Logs:</text>
    <text x="14" y="142" class="mono-text" fill="#10B981">&check; 7-Table SQLite DB</text>
    <text x="14" y="158" class="mono-text" fill="#10B981">&check; Append-Only Ledger</text>
    <rect x="14" y="172" width="142" height="16" rx="3" fill="#064E3B" />
    <text x="20" y="184" class="mono-text" fill="#A7F3D0" font-size="9">VAULT SECURED &amp; LOCKED</text>
  </g>

  <!-- STAGE 4: Decentralized EVM Blockchain Anchor -->
  <g transform="translate(700, 65)">
    <rect width="180" height="190" class="node-card" fill="url(#cardGrad1)" stroke="#D97706" />
    <rect width="180" height="30" rx="10" fill="#92400E" />
    <text x="14" y="20" class="title-text">4. EVM Proof Anchor</text>
    <circle cx="162" cy="15" r="3.5" fill="#FBBF24" />

    <text x="14" y="55" class="sub-text">EvidenceRegistry.sol</text>
    <rect x="14" y="65" width="152" height="42" rx="5" fill="#0B132B" stroke="#B45309" stroke-width="1" />
    <text x="22" y="82" class="mono-text" fill="#FCD34D">Domain Commitment</text>
    <text x="22" y="96" class="mono-text" fill="#FDE68A">Proof-of-Existence</text>

    <text x="14" y="126" class="sub-text">Guarantees &amp; Sync:</text>
    <text x="14" y="142" class="mono-text" fill="#10B981">&check; Duplicate Prevention</text>
    <text x="14" y="158" class="mono-text" fill="#38BDF8">&check; Offline Queue Buffer</text>
    <rect x="14" y="172" width="152" height="16" rx="3" fill="#78350F" />
    <text x="20" y="184" class="mono-text" fill="#FDE68A" font-size="9">IMMUTABLE ANCHOR</text>
  </g>

  <!-- Bottom Real-time Parity Bar -->
  <g transform="translate(40, 275)">
    <rect width="840" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#10B981" />
    <text x="32" y="18" class="mono-text" fill="#E2E8F0" font-weight="600">
      THREE-WAY PARITY VERIFICATION:
    </text>
    <text x="240" y="18" class="mono-text" fill="#38BDF8">
      [1] Live Vault Bitstream SHA-256
    </text>
    <text x="440" y="18" class="mono-text" fill="#94A3B8">&harr;</text>
    <text x="460" y="18" class="mono-text" fill="#10B981">
      [2] SQLite Reference Record
    </text>
    <text x="635" y="18" class="mono-text" fill="#94A3B8">&harr;</text>
    <text x="655" y="18" class="mono-text" fill="#FCD34D">
      [3] EVM On-Chain Commitment
    </text>
  </g>
</svg>
