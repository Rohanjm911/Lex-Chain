<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      .link-line {
        stroke: #1E293B;
        stroke-width: 2.5;
        stroke-linecap: round;
        fill: none;
      }
      .link-active {
        stroke: #00F2FE;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        stroke-linecap: round;
        fill: none;
      }
      .link-gold {
        stroke: #F59E0B;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        stroke-linecap: round;
        fill: none;
      }
      .custody-card {
        rx: 8; ry: 8;
        stroke-width: 1.5;
      }
      .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .mono-font { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 9.5px; }
      .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; }
    </style>

    <linearGradient id="bgCustody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1A02" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
  </defs>

  <rect width="920" height="280" rx="12" fill="url(#bgCustody)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" />

  <!-- Header Banner -->
  <g transform="translate(30, 20)">
    <circle cx="6" cy="10" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="14" class="title-font" fill="#00F2FE" letter-spacing="1.2">
      APPEND-ONLY CHAIN OF CUSTODY &amp; CRYPTOGRAPHIC DAG TIMELINE
    </text>
    <rect x="620" y="0" width="240" height="20" rx="4" fill="#042616" stroke="#00FF88" stroke-opacity="0.4" />
    <text x="630" y="14" class="mono-font" fill="#00FF88" font-weight="700">&#10003; COURT ADMISSIBILITY: FRE RULE 901</text>
  </g>

  <!-- Connection Links (Behind Nodes) -->
  <g transform="translate(0, 40)">
    <!-- Node 1 to Node 2 -->
    <path d="M 220 85 L 255 85" class="link-line" />
    <path d="M 220 85 L 255 85" class="link-active">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite" />
    </path>
    <circle cx="220" cy="85" r="3.5" fill="#00F2FE">
      <animate attributeName="cx" values="220; 255" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 2 to Node 3 -->
    <path d="M 435 85 L 470 85" class="link-line" />
    <path d="M 435 85 L 470 85" class="link-active">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite" />
    </path>
    <circle cx="435" cy="85" r="3.5" fill="#00F2FE">
      <animate attributeName="cx" values="435; 470" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 3 to Node 4 -->
    <path d="M 650 85 L 685 85" class="link-line" />
    <path d="M 650 85 L 685 85" class="link-gold">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite" />
    </path>
    <circle cx="650" cy="85" r="3.5" fill="#F59E0B">
      <animate attributeName="cx" values="650; 685" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Node 1: Genesis Intake -->
  <g transform="translate(30, 75)">
    <rect width="190" height="135" class="custody-card" fill="#070D1A" stroke="#00FF88" stroke-opacity="0.4" />
    <rect width="190" height="26" rx="8" fill="#042616" />
    <text x="12" y="17" class="title-font" fill="#00FF88">01. GENESIS INTAKE</text>
    <rect x="120" y="5" width="60" height="16" rx="3" fill="#064E3B" />
    <text x="126" y="16" class="tag-font" fill="#A7F3D0">EVD_INTAKE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-001</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">Officer: <tspan fill="#00F2FE">Inv. Chen (ID: 042)</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Action: <tspan fill="#00FF88">REGISTERED</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#94A3B8">GENESIS (NULL)</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Hash: <tspan fill="#00F2FE">d7a8fbb307...e4f8</tspan></text>
  </g>

  <!-- Node 2: Forensic Analysis -->
  <g transform="translate(245, 75)">
    <rect width="190" height="135" class="custody-card" fill="#070D1A" stroke="#00F2FE" stroke-opacity="0.4" />
    <rect width="190" height="26" rx="8" fill="#0B1E38" />
    <text x="12" y="17" class="title-font" fill="#00F2FE">02. LAB ANALYSIS</text>
    <rect x="125" y="5" width="55" height="16" rx="3" fill="#0C4A6E" />
    <text x="131" y="16" class="tag-font" fill="#BAE6FD">EXAMINE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-002</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">Officer: <tspan fill="#00F2FE">Analyst Vance</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Action: <tspan fill="#60A5FA">VERIFIED PARITY</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#00F2FE">CUST-001</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Audit: <tspan fill="#00FF88">&#10003; 100% Bit Parity</tspan></text>
  </g>

  <!-- Node 3: Custody Transfer -->
  <g transform="translate(460, 75)">
    <rect width="190" height="135" class="custody-card" fill="#070D1A" stroke="#818CF8" stroke-opacity="0.4" />
    <rect width="190" height="26" rx="8" fill="#1E1B4B" />
    <text x="12" y="17" class="title-font" fill="#C7D2FE">03. SAFE TRANSFER</text>
    <rect x="125" y="5" width="55" height="16" rx="3" fill="#3730A3" />
    <text x="132" y="16" class="tag-font" fill="#E0E7FF">TRANSFER</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-003</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">To: <tspan fill="#818CF8">Lead Agent Adams</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Reason: <tspan fill="#A5B4FC">Secured Vault Hold</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#02040A" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#818CF8">CUST-002</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Lock: <tspan fill="#A5B4FC">Win32 Read-Only ACL</tspan></text>
  </g>

  <!-- Node 4: Blockchain Anchor -->
  <g transform="translate(675, 75)">
    <rect width="215" height="135" class="custody-card" fill="url(#goldGlow)" stroke="#F59E0B" stroke-opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.4; 0.9; 0.4" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect width="215" height="26" rx="8" fill="#3D1A02" />
    <circle cx="16" cy="13" r="4" fill="#F59E0B">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" class="title-font" fill="#FDE68A">04. ON-CHAIN ANCHOR</text>
    <rect x="145" y="5" width="60" height="16" rx="3" fill="#B45309" />
    <text x="151" y="16" class="tag-font" fill="#FFFFFF">IMMUTABLE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-004</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">EVM Tx: <tspan fill="#F59E0B">0x9b4a...1c2e</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Block: <tspan fill="#FDE68A">#42 (Confirmed)</tspan></text>
    
    <rect x="10" y="83" width="195" height="42" rx="4" fill="#02040A" stroke="#78350F" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Commit: <tspan fill="#F59E0B">Keccak-256 Event Root</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#00FF88">&#10003; Zero Rollback &#8226; Non-Repudiation</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(30, 226)">
    <rect width="860" height="36" rx="6" fill="#070D1A" stroke="#1E293B" />
    <circle cx="20" cy="18" r="5" fill="#00FF88" />
    <text x="35" y="22" class="title-font" fill="#F8FAFC">
      DAG TOPOLOGICAL INTEGRITY: 
      <tspan fill="#00FF88">ALL 4 PARENT REFERENCES VALIDATED</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#00F2FE">CHAIN CONTINUITY: 100% UNBROKEN</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#94A3B8">EVIDENTIARY AUDIT LOG: TAMPER-SEALED</tspan>
    </text>
  </g>
</svg>
