<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      @keyframes linkFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9)); }
      }
      @keyframes anchorBeacon {
        0%, 100% { fill: #F59E0B; filter: drop-shadow(0 0 2px #F59E0B); }
        50% { fill: #FDE68A; filter: drop-shadow(0 0 10px #F59E0B); }
      }
      @keyframes scanSweep {
        0% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 0.7; }
        75% { opacity: 0.7; }
        100% { transform: translateY(68px); opacity: 0; }
      }
      .link-line {
        stroke: #334155;
        stroke-width: 2.5;
        stroke-linecap: round;
        fill: none;
      }
      .link-active {
        stroke: #38BDF8;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        stroke-linecap: round;
        animation: linkFlow 1.6s linear infinite;
        fill: none;
      }
      .link-gold {
        stroke: #F59E0B;
        stroke-width: 2.5;
        stroke-dasharray: 6 8;
        stroke-linecap: round;
        animation: linkFlow 1.6s linear infinite;
        fill: none;
      }
      .custody-card {
        rx: 8; ry: 8;
        stroke-width: 1.5;
        transition: all 0.3s;
      }
      .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .mono-font { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 9.5px; }
      .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; }
    </style>

    <linearGradient id="bgCustody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="920" height="280" rx="12" fill="url(#bgCustody)" stroke="#1E293B" stroke-width="2" />

  <!-- Header Banner -->
  <g transform="translate(30, 20)">
    <text x="0" y="14" class="title-font" fill="#38BDF8" letter-spacing="1.2">
      APPEND-ONLY CHAIN OF CUSTODY &amp; CRYPTOGRAPHIC DAG TIMELINE
    </text>
    <rect x="620" y="0" width="240" height="20" rx="4" fill="#065F46" stroke="#059669" />
    <text x="630" y="14" class="mono-font" fill="#6EE7B7" font-weight="700">&check; COURT ADMISSIBILITY: FRE RULE 901</text>
  </g>

  <!-- Connection Links (Behind Nodes) -->
  <g transform="translate(0, 40)">
    <!-- Node 1 to Node 2 -->
    <path d="M 220 85 L 255 85" class="link-line" />
    <path d="M 220 85 L 255 85" class="link-active" />
    <!-- Node 2 to Node 3 -->
    <path d="M 435 85 L 470 85" class="link-line" />
    <path d="M 435 85 L 470 85" class="link-active" />
    <!-- Node 3 to Node 4 -->
    <path d="M 650 85 L 685 85" class="link-line" />
    <path d="M 650 85 L 685 85" class="link-gold" />
  </g>

  <!-- Node 1: Genesis Intake -->
  <g transform="translate(30, 75)">
    <rect width="190" height="135" class="custody-card" fill="#1E293B" stroke="#059669" />
    <rect width="190" height="26" rx="8" fill="#065F46" />
    <text x="12" y="17" class="title-font" fill="#A7F3D0">01. GENESIS INTAKE</text>
    <rect x="120" y="5" width="60" height="16" rx="3" fill="#047857" />
    <text x="126" y="16" class="tag-font" fill="#FFFFFF">EVD_INTAKE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-001</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">Officer: <tspan fill="#38BDF8">Inv. Chen (ID: 042)</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Action: <tspan fill="#34D399">REGISTERED</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#0B132B" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#94A3B8">GENESIS (NULL)</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Hash: <tspan fill="#38BDF8">d7a8fbb307...e4f8</tspan></text>
  </g>

  <!-- Node 2: Forensic Analysis -->
  <g transform="translate(245, 75)">
    <rect width="190" height="135" class="custody-card" fill="#1E293B" stroke="#2563EB" />
    <rect width="190" height="26" rx="8" fill="#1E3A8A" />
    <text x="12" y="17" class="title-font" fill="#BFDBFE">02. LAB ANALYSIS</text>
    <rect x="125" y="5" width="55" height="16" rx="3" fill="#1D4ED8" />
    <text x="131" y="16" class="tag-font" fill="#FFFFFF">EXAMINE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-002</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">Officer: <tspan fill="#38BDF8">Analyst Vance</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Action: <tspan fill="#60A5FA">VERIFIED PARITY</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#0B132B" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#38BDF8">CUST-001</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Audit: <tspan fill="#10B981">&check; 100% Bit Parity</tspan></text>
  </g>

  <!-- Node 3: Custody Transfer -->
  <g transform="translate(460, 75)">
    <rect width="190" height="135" class="custody-card" fill="#1E293B" stroke="#6366F1" />
    <rect width="190" height="26" rx="8" fill="#312E81" />
    <text x="12" y="17" class="title-font" fill="#C7D2FE">03. SAFE TRANSFER</text>
    <rect x="125" y="5" width="55" height="16" rx="3" fill="#4338CA" />
    <text x="132" y="16" class="tag-font" fill="#FFFFFF">TRANSFER</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-003</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">To: <tspan fill="#38BDF8">Lead Agent Adams</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Reason: <tspan fill="#A5B4FC">Secured Vault Hold</tspan></text>
    
    <rect x="10" y="83" width="170" height="42" rx="4" fill="#0B132B" stroke="#1E293B" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Prev Ref: <tspan fill="#818CF8">CUST-002</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#64748B">Lock: <tspan fill="#A5B4FC">Win32 Read-Only ACL</tspan></text>
  </g>

  <!-- Node 4: Blockchain Anchor -->
  <g transform="translate(675, 75)">
    <rect width="215" height="135" class="custody-card" fill="url(#goldGlow)" stroke="#F59E0B" />
    <rect width="215" height="26" rx="8" fill="#78350F" />
    <circle cx="16" cy="13" r="4" style="animation: anchorBeacon 1.8s infinite;" />
    <text x="26" y="17" class="title-font" fill="#FDE68A">04. ON-CHAIN ANCHOR</text>
    <rect x="145" y="5" width="60" height="16" rx="3" fill="#B45309" />
    <text x="151" y="16" class="tag-font" fill="#FFFFFF">IMMUTABLE</text>

    <text x="12" y="44" class="mono-font" fill="#94A3B8">ID: <tspan fill="#F8FAFC">CUST-004</tspan></text>
    <text x="12" y="59" class="mono-font" fill="#94A3B8">EVM Tx: <tspan fill="#F59E0B">0x9b4a...1c2e</tspan></text>
    <text x="12" y="74" class="mono-font" fill="#94A3B8">Block: <tspan fill="#FDE68A">#42 (Confirmed)</tspan></text>
    
    <rect x="10" y="83" width="195" height="42" rx="4" fill="#0B132B" stroke="#78350F" />
    <text x="16" y="97" class="mono-font" fill="#64748B">Commit: <tspan fill="#F59E0B">Keccak-256 Event Root</tspan></text>
    <text x="16" y="112" class="mono-font" fill="#10B981">&check; Zero Rollback &bull; Non-Repudiation</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(30, 226)">
    <rect width="860" height="36" rx="6" fill="#1E293B" stroke="#334155" />
    <circle cx="20" cy="18" r="5" fill="#10B981" />
    <text x="35" y="22" class="title-font" fill="#F8FAFC">
      DAG TOPOLOGICAL INTEGRITY: 
      <tspan fill="#10B981">ALL 4 PARENT REFERENCES VALIDATED</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#38BDF8">CHAIN CONTINUITY: 100% UNBROKEN</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#94A3B8">EVIDENTIARY AUDIT LOG: TAMPER-SEALED</tspan>
    </text>
  </g>
</svg>
